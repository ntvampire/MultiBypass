name: Build MultiBypass APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            aarch64-linux-android
            armv7-linux-androideabi

      - name: Cache Rust build dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-ndk
        uses: taiki-e/install-action@cargo-binstall

      - name: Provision cargo-ndk binary
        run: cargo binstall -y cargo-ndk

      - name: Set up Android NDK & CMake
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          add-to-path: true

      - name: Run Rust unit tests
        run: cargo test

      - name: Build Rust libtgwsproxy.so with cargo-ndk
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
          RUSTFLAGS: "-C link-arg=-Wl,-z,max-page-size=16384"
        run: cargo ndk -t arm64-v8a -t armeabi-v7a --platform 28 -o app/src/main/jniLibs build --release

      - name: Set executable permissions for gradlew
        run: chmod +x ./gradlew

      - name: Test & Build with Gradle
        run: ./gradlew testDebugUnitTest assembleRelease --stacktrace

      - name: Find and organize APKs
        run: |
          mkdir -p release-apks
          for f in $(find app/build/outputs/apk/release/ -type f -name "*.apk"); do
            filename=$(basename "$f")
            newname=$(echo "$filename" | sed -E 's/^app(-beta)?-/MultiBypass-CI-/' | sed -E 's/-release\.apk$/.apk/')
            cp "$f" "release-apks/$newname"
          done
          ls -lah release-apks/

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MultiBypass-CI-APKs
          path: release-apks/*.apk
          retention-days: 14
