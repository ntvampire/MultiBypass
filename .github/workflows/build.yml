name: Build MultiBypass APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android NDK & CMake
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          add-to-path: true

      - name: Set executable permissions for gradlew
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew assembleRelease --stacktrace

      - name: Find and organize APKs
        run: |
          mkdir -p release-apks
          find app/build/outputs/apk/release/ -type f -name "*.apk" -exec cp {} release-apks/ \;
          ls -lah release-apks/

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MultiBypass-APKs
          path: release-apks/*.apk
          retention-days: 14
