name: Publish Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android NDK & CMake
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          add-to-path: true

      - name: Set executable permissions for gradlew
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew assembleRelease --stacktrace

      - name: Organize APKs for release
        run: |
          mkdir -p release-apks
          TAG="${{ github.ref_name }}"
          for f in $(find app/build/outputs/apk/release/ -type f -name "*.apk"); do
            filename=$(basename "$f")
            newname=$(echo "$filename" | sed -E "s/^app-/MultiBypass-${TAG}-/" | sed -E 's/-release\.apk$/.apk/')
            cp "$f" "release-apks/$newname"
          done
          ls -lah release-apks/

      - name: Generate Release Notes
        run: |
          TAG="${{ github.ref_name }}"

          echo "## 📱 MultiBypass $TAG" > release_notes.md
          echo "" >> release_notes.md

          if [ -f "RELEASE_NOTES.md" ]; then
            echo "### 📝 Изменения:" >> release_notes.md
            cat RELEASE_NOTES.md >> release_notes.md
            echo "" >> release_notes.md
          fi

          cat << EOF >> release_notes.md
          ---

          ### 📦 Файлы для загрузки:
          - **\`MultiBypass-${TAG}-arm64-v8a.apk\`** — ARM 64-bit (рекомендуется для большинства устройств)
          - **\`MultiBypass-${TAG}-universal.apk\`** — универсальный пакет (все архитектуры)
          - **\`MultiBypass-${TAG}-armeabi-v7a.apk\`** — ARM 32-bit (для более ранних моделей)
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: MultiBypass ${{ github.ref_name }}
          body_path: release_notes.md
          files: release-apks/*.apk
          draft: false
          prerelease: false
