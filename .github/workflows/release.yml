name: Publish Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: |
            aarch64-linux-android
            armv7-linux-androideabi

      - name: Cache Rust build dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-ndk
        uses: taiki-e/install-action@cargo-binstall

      - name: Provision cargo-ndk binary
        run: cargo binstall -y cargo-ndk

      - name: Set up Android NDK & CMake
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d
          add-to-path: true

      - name: Run Rust unit tests
        run: cargo test

      - name: Build Rust libtgwsproxy.so with cargo-ndk
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
          RUSTFLAGS: "-C link-arg=-Wl,-z,max-page-size=16384"
        run: cargo ndk -t arm64-v8a -t armeabi-v7a --platform 28 -o app/src/main/jniLibs build --release

      - name: Set executable permissions for gradlew
        run: chmod +x ./gradlew

      - name: Decode Release Keystore
        run: |
          mkdir -p keystore
          echo "${{ secrets.KEYSTORE_BASE64 }}" | tr -d '\r\n ' | base64 --decode > keystore/multibypass-release.p12

      - name: Test & Build with Gradle
        env:
          SIGNING_KEYSTORE_PATH: ${{ github.workspace }}/keystore/multibypass-release.p12
          SIGNING_STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest assembleRelease --stacktrace

      - name: Organize APKs for release
        run: |
          mkdir -p release-apks
          TAG="${{ github.ref_name }}"
          for f in $(find app/build/outputs/apk/release/ -type f -name "*.apk"); do
            filename=$(basename "$f")
            newname=$(echo "$filename" | sed -E "s/^app-/MultiBypass-${TAG}-/" | sed -E 's/-release\.apk$/.apk/')
            cp "$f" "release-apks/$newname"
          done
          ls -lah release-apks/

      - name: Generate Release Notes
        run: |
          TAG="${{ github.ref_name }}"

          echo "## 📱 MultiBypass $TAG" > release_notes.md
          echo "" >> release_notes.md

          if [ -f "RELEASE_NOTES.md" ]; then
            echo "### 📝 Изменения:" >> release_notes.md
            NOTES=$(awk -v tag="## MultiBypass $TAG" '$0 ~ tag {flag=1; next} flag && /^---/ {exit} flag {print}' RELEASE_NOTES.md)
            if [ -n "$NOTES" ]; then
              echo "$NOTES" >> release_notes.md
            else
              awk 'BEGIN{p=0} /^## MultiBypass/{if(p) exit; p=1} /^---/{if(p) exit} p{print}' RELEASE_NOTES.md >> release_notes.md
            fi
            echo "" >> release_notes.md
          fi

          cat << EOF >> release_notes.md
          ---

          ### 📦 Файлы для загрузки:
          - **\`MultiBypass-${TAG}-arm64-v8a.apk\`** — ARM 64-bit (рекомендуется для большинства устройств)
          - **\`MultiBypass-${TAG}-universal.apk\`** — универсальный пакет (все архитектуры)
          - **\`MultiBypass-${TAG}-armeabi-v7a.apk\`** — ARM 32-bit (для более ранних моделей)
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: MultiBypass ${{ github.ref_name }}
          body_path: release_notes.md
          files: release-apks/*.apk
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') }}
