name: Update Mobile Lists, Strategies & Providers

on:
  schedule:
    # Run weekly on Wednesdays at 04:37 UTC (offset non-standard minute to avoid GitHub Actions peak traffic)
    - cron: '37 4 * * 3'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-lists:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Lists & Strategies Pipeline
        run: python scripts/update_domains.py

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ app/src/main/assets/
          if git diff --staged --quiet; then
            echo "No changes in domain lists, strategies or providers."
          else
            git commit -m "chore(lists): automatic weekly update of domain lists, strategies and providers"
            git push
          fi
